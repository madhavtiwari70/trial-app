# Quantum-Guided Cluster Algorithm — demo data file
# Edit the values below to change the demo. No code changes needed.

graph:
  n_nodes: 16
  degree: 12
  seed: 42

qaoa_depths: [1, 2, 3]     # QAOA depths to compare; use [] to skip QAOA
pce_encodings: []          # e.g. ["dense"] to add a PCE row to the comparison

algorithm:
  n_iterations_factor: 500   # total iterations = factor * n_nodes
  n_repetitions: 30
  lambda_scale: 4

backend:
  use_cloud: false     # true = QoroService, false = local simulator
  shots: 10000
