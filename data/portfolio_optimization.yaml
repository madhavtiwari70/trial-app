# Portfolio Optimization — demo data file
# Edit the values below to change the demo. No code changes needed.
# (This covers the small synthetic-portfolio part of the original notebook.
# The notebook's second part — a real 480-asset S&P 500 portfolio with
# partitioned QAOA — isn't included in this config-driven version, since
# it's a much longer-running scenario.)

n_assets: 8
seed: 42
lambda_param: 0.75    # risk-aversion weight in the QUBO

qaoa:
  n_layers: 2
  max_iterations: 10
  population_size: 30
  n_best_sets: 5

backend:
  shots: 10000
