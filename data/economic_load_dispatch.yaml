# Economic Load Dispatch — demo data file
# Edit the values below to change the demo. No code changes needed.
# (This covers the 3-generator scenario from the original demo.)

demand: 195   # MW — total power the grid needs

generators:
  - name: "Gen 1"
    a: 20
    b: 2.0
    c: 0.010
    P_min: 40
    P_max: 115
    poz_low: 60
    poz_high: 75

  - name: "Gen 2"
    a: 15
    b: 1.5
    c: 0.020
    P_min: 20
    P_max: 95
    poz_low: 40
    poz_high: 55

  - name: "Gen 3"
    a: 25
    b: 1.8
    c: 0.015
    P_min: 30
    P_max: 105
    poz_low: 50
    poz_high: 65

pce:
  n_layers: 3
  max_iterations: 20
  alpha: 3.0

backend:
  use_cloud: false     # true = QoroService, false = local MaestroSimulator
  shots: 10000
